services:
  postgres:
    image: postgres:17-alpine
    container_name: docsku-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docsku
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: docsku
    ports:
      # Only reachable from this machine.
      - "127.0.0.1:5491:5432"
    volumes:
      - docsku-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsku -d docsku"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  docsku-pgdata:
