# Production app (PostgreSQL included). HTTPS is done by your own reverse proxy,
# which forwards to APP_PORT on this host (see README → Produksi).
# Use deploy/deploy.sh, which pulls the image GitHub built and starts it. By hand:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production pull app
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d app
# The app migrates the database itself when it starts. Settings: .env.production (see .env.production.example).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: docsku
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: docsku
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Local only: for `pnpm db:studio` and backups from this host.
      - "127.0.0.1:5491:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsku -d docsku"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Built by .github/workflows/docker.yml for every release (pnpm release X.Y.Z).
    # DOCSKU_VERSION picks the release (default: the newest); `deploy.sh --build` builds it here instead.
    image: ${DOCSKU_IMAGE:-ghcr.io/teknik-github/docsku}:${DOCSKU_VERSION:-latest}
    build:
      context: .
      target: runner
      args:
        NEXT_DEPLOYMENT_ID: ${NEXT_DEPLOYMENT_ID:-}
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://docsku:${POSTGRES_PASSWORD}@postgres:5432/docsku
      # Only the reverse proxy can reach the app (127.0.0.1 below), so its X-Forwarded-* headers are trusted.
      # Behind Cloudflare, set TRUST_PROXY=cloudflare in .env.production (see README → Cloudflare).
      TRUST_PROXY: ${TRUST_PROXY:-1}
      UPLOAD_DIR: /app/storage/uploads
    volumes:
      # Same folder the dev server uses; must be writable by uid 10001 (see deploy/deploy.sh).
      - ./storage/uploads:/app/storage/uploads
    ports:
      # Local only: put your HTTPS reverse proxy in front of it.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3020}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
